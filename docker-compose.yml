services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mqi
      POSTGRES_PASSWORD: mqi
      POSTGRES_DB: mqi
    ports:
      - "5432:5432"
    healthcheck:
      # The backend loads data on start, so it has to wait for a database that accepts
      # connections, not just a container that exists.
      test: ["CMD-SHELL", "pg_isready -U mqi -d mqi"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://mqi:mqi@db:5432/mqi
      DATA_DIR: /srv/data
      CORS_ORIGIN: http://localhost:5173
    volumes:
      - ./data:/srv/data:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
